<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Карточка товара — WB Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap"
    />
    <link rel="stylesheet" href="/css/common/sidebar.css" />
    <link rel="stylesheet" href="/css/common/tables.css" />
    <link rel="stylesheet" href="/css/card/card.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar" data-active="cards">
        <div class="sidebar-head">
          <button type="button" class="sidebar-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Развернуть меню">
            <span></span><span></span><span></span>
          </button>
          <a class="brand" href="/"><span class="brand-mark">W</span><span>WB Pulse</span></a>
        </div>
        <!-- Пункты меню и кабинет внизу рисует sidebar.js — одно меню на все страницы сайта. -->
        <nav aria-label="Разделы"></nav>
      </aside>
      <main>
        <header class="page-head">
          <div class="card-head">
            <img class="card-photo" id="cardPhoto" alt="" />
            <div>
              <h1 id="cardTitle">Карточка товара</h1>
              <p class="card-meta" id="cardMeta"></p>
              <div class="card-rating-line" id="cardRating"></div>
            </div>
          </div>
          <div class="head-actions">
            <button type="button" class="btn" id="reloadButton" title="Загрузить карточку из WB заново">↻ Обновить</button>
            <div class="notice-wrap">
              <button
                class="notice-bell"
                id="noticeBell"
                type="button"
                aria-label="Уведомления"
                aria-expanded="false"
                aria-controls="noticePanel"
                title="Уведомлений нет"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 3.5a5.2 5.2 0 0 0-5.2 5.2v3.1c0 1-.4 2-1.1 2.7l-.9.9h14.4l-.9-.9a3.8 3.8 0 0 1-1.1-2.7V8.7A5.2 5.2 0 0 0 12 3.5z"
                  />
                  <path d="M9.8 18.4a2.3 2.3 0 0 0 4.4 0" /></svg
                ><b id="noticeCount" hidden>0</b>
              </button>
              <div class="notice-panel" id="noticePanel" role="dialog" aria-label="Уведомления" hidden></div>
            </div>
            <p class="status-line" id="statusLine" role="status" aria-live="polite">Загрузка…</p>
          </div>
        </header>
        <div id="banners"></div>
        <div id="content"><div class="loading">Загрузка карточки из WB…</div></div>
      </main>
    </div>
    <div class="savebar" id="savebar" hidden>
      <p id="saveSummary"></p>
      <button type="button" class="btn" id="discardButton">Отменить изменения</button
      ><button type="button" class="btn primary" id="saveButton">Сохранить в WB</button>
    </div>
    <div class="overlay" id="overlay" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
    <script src="/js/common/sidebar.js"></script>
    <script src="/js/common/shift-select.js"></script>
    <script>
      // Колокольчик берём с основного сайта (notifications.js): ему нужны раздел страницы и escapeHtml.
      const state = { activePage: 'card' };
      function escapeHtml(value) { return String(value ?? '').replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char])); }
    </script>
    <script src="/js/common/notifications.js"></script>
    <script src="/js/common/column-widths.js"></script>
    <script src="/js/card/card.js"></script>
  </body>
</html>
